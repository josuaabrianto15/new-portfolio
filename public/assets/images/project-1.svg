<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c070a" />
      <stop offset="50%" stop-color="#1b0913" />
      <stop offset="100%" stop-color="#090507" />
    </linearGradient>
    <linearGradient id="accentGis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80112c" />
      <stop offset="100%" stop-color="#e63956" />
    </linearGradient>
    <pattern id="gisGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e63956" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#gisBg)" />
  <rect width="800" height="500" fill="url(#gisGrid)" />

  <!-- Ambient Glow -->
  <circle cx="580" cy="220" r="180" fill="#80112c" opacity="0.3" filter="blur(60px)" />

  <!-- Window Chrome -->
  <rect x="40" y="30" width="720" height="440" rx="16" fill="#11090f" stroke="#80112c" stroke-width="1.2" stroke-opacity="0.4" />
  <rect x="40" y="30" width="720" height="42" rx="16" fill="#1b0a15" />
  <circle cx="68" cy="51" r="5" fill="#e63956" opacity="0.8" />
  <circle cx="85" cy="51" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="102" cy="51" r="5" fill="#10b981" opacity="0.8" />
  <rect x="130" y="42" width="280" height="18" rx="6" fill="#280f1e" />
  <text x="145" y="55" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">igun-technology.webgis.app/zonasi-spmb</text>

  <!-- Left Sidebar (Control Panel) -->
  <rect x="55" y="85" width="230" height="370" rx="10" fill="#170a13" stroke="#80112c" stroke-width="0.8" stroke-opacity="0.5" />
  <text x="75" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">IGUN WebGIS</text>
  <text x="75" y="132" fill="#e63956" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SMART SCHOOL FINDER</text>

  <!-- Search / Input Mockup -->
  <rect x="75" y="150" width="190" height="32" rx="6" fill="#240e1b" stroke="#80112c" stroke-width="0.7" />
  <text x="88" y="170" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">📍 Lokasi Domisili Siswa...</text>

  <!-- Filter Zonasi -->
  <rect x="75" y="192" width="190" height="30" rx="6" fill="#240e1b" stroke="#80112c" stroke-width="0.7" />
  <text x="88" y="211" fill="#f5f5f7" font-family="system-ui, sans-serif" font-size="10">Radius Zonasi: 3.0 KM</text>

  <!-- Recommendation List Header -->
  <text x="75" y="250" fill="#71717a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">3 REKOMENDASI TERDEKAT:</text>

  <!-- Card 1 -->
  <rect x="75" y="265" width="190" height="54" rx="8" fill="#2a101f" stroke="#e63956" stroke-width="1" />
  <text x="88" y="286" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">1. SMAN 1 Bogor</text>
  <text x="88" y="304" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">✓ 1.15 KM • Memenuhi Zonasi</text>

  <!-- Card 2 -->
  <rect x="75" y="327" width="190" height="54" rx="8" fill="#1c0b15" stroke="#80112c" stroke-width="0.7" />
  <text x="88" y="348" fill="#f5f5f7" font-family="system-ui, sans-serif" font-weight="600" font-size="11">2. SMAN 3 Bogor</text>
  <text x="88" y="366" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">✓ 2.30 KM • Memenuhi Zonasi</text>

  <!-- Card 3 -->
  <rect x="75" y="389" width="190" height="52" rx="8" fill="#1c0b15" stroke="#80112c" stroke-width="0.7" />
  <text x="88" y="410" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="600" font-size="11">3. SMAN 5 Bogor</text>
  <text x="88" y="428" fill="#e63956" font-family="system-ui, sans-serif" font-size="9">2.95 KM • Ambang Batas</text>

  <!-- Map Canvas on Right -->
  <rect x="300" y="85" width="445" height="370" rx="10" fill="#0f070d" stroke="#80112c" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Map Vector Roads / GIS Lines -->
  <path d="M 320 180 Q 450 140 550 210 T 730 250" fill="none" stroke="#2b1120" stroke-width="12" />
  <path d="M 460 90 L 520 440" fill="none" stroke="#2b1120" stroke-width="10" />
  <path d="M 330 360 Q 480 320 620 380 L 730 400" fill="none" stroke="#2b1120" stroke-width="8" />

  <!-- Radius Buffer Circle (Leaflet Turf.js) -->
  <circle cx="520" cy="240" r="120" fill="#80112c" fill-opacity="0.2" stroke="#e63956" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="520" cy="240" r="50" fill="#e63956" fill-opacity="0.1" />

  <!-- Home Location Pin (Center) -->
  <circle cx="520" cy="240" r="9" fill="#e63956" />
  <circle cx="520" cy="240" r="16" fill="none" stroke="#e63956" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="12;24;12" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <rect x="535" y="225" width="95" height="24" rx="5" fill="#1b0a14" stroke="#e63956" stroke-width="1" />
  <text x="545" y="241" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Rumah Siswa</text>

  <!-- Distance Line connecting Home to School -->
  <line x1="520" y1="240" x2="430" y2="160" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3" />

  <!-- School Pin 1 -->
  <circle cx="430" cy="160" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <rect x="370" y="125" width="105" height="24" rx="5" fill="#160811" stroke="#10b981" stroke-width="1" />
  <text x="382" y="141" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">SMAN 1 (1.15 km)</text>

  <!-- School Pin 2 -->
  <circle cx="610" cy="290" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <rect x="625" y="280" width="95" height="22" rx="4" fill="#160811" stroke="#80112c" stroke-width="0.8" />
  <text x="635" y="295" fill="#f5f5f7" font-family="system-ui, sans-serif" font-size="8">SMAN 3 (2.3 km)</text>

  <!-- School Pin 3 (Far) -->
  <circle cx="630" cy="130" r="7" fill="#e63956" stroke="#ffffff" stroke-width="1.5" />

  <!-- Map Floating Controls -->
  <rect x="690" y="100" width="36" height="70" rx="6" fill="#1a0b15" stroke="#80112c" stroke-width="0.8" />
  <text x="708" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">+</text>
  <line x1="695" y1="135" x2="720" y2="135" stroke="#3b1b28" />
  <text x="708" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">−</text>

  <!-- Layer Badge Bottom Right -->
  <rect x="570" y="415" width="160" height="26" rx="6" fill="#170912" stroke="#80112c" stroke-width="0.8" />
  <circle cx="585" cy="428" r="4" fill="#10b981" />
  <text x="597" y="432" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">Leaflet • Turf.js • PostGIS</text>
</svg>